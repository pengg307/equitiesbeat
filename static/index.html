<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Market Trading Dashboard</title>
<link rel="stylesheet" href="/static/css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="header">
 <div class="logo">
   <div class="logo-icon">M</div>
   <div><h1>Multi-Market Dashboard</h1><p>Real-time Multi-Asset Trading</p></div>
 </div>
 <div class="mkt-tabs" id="mktTabs"></div>
 <div class="clock-box">
   <div class="time" id="clock">--:--:--</div>
   <div class="mst">
     <span class="live-dot" id="liveDot"></span>
     <span id="mktTxt">Connecting...</span>
     <span class="ws-status" id="wsStatus">o</span>
   </div>
 </div>
</header>

<div class="idx-bar" id="idxBar"></div>

<div class="page">
<aside class="sidebar">
 <div class="sb-head">
   <h2>Filters <span class="filter-badge" id="filterBadge" style="display:none">0</span></h2>
   <div class="logic-wrap">
     <span class="logic-label">Logic:</span>
     <div class="logic-toggle">
       <button class="logic-opt active-and" id="optAND" onclick="setLogic('AND')">AND</button>
       <button class="logic-opt" id="optOR" onclick="setLogic('OR')">OR</button>
     </div>
   </div>
 </div>

 <div class="sb-scroll">
   <div>
     <div class="sec-title">Basic Filters</div>
     <div class="ctrl-col">
       <div class="srch-wrap"><span class="srch-ico">S</span><input class="inp" id="searchInp" placeholder="Code / Name..."></div>
       <div class="ctrl-row">
         <select class="sel" id="exchSel"></select>
         <select class="sel" id="sectorSel"></select>
       </div>
     </div>
   </div>

   <div>
     <div class="sec-title">Quick Filters <span id="quickLbl" class="quick-lbl"></span></div>
     <div class="pills" id="quickPills"></div>
   </div>

   <div>
     <div class="sec-title">Price Change</div>
     <div class="pills" id="chgPills"></div>
   </div>

   <div>
     <div class="sec-title">Technical Signals</div>
     <div id="indicatorAccordions"></div>
   </div>

   <div>
     <div class="sec-title">Page Size</div>
     <select class="sel" id="pgSzSel" style="width:auto">
       <option value="20">20</option><option value="50">50</option><option value="100">100</option>
     </select>
   </div>
 </div>
 <div class="sb-foot">
   <button class="btn-apply" onclick="applyFilters()" id="applyBtn">Apply Filters</button>
   <button class="btn-reset" onclick="resetAll()">Reset</button>
 </div>
</aside>

<div class="main">
 <div class="res-bar">
   <div><div class="res-count">Total: <span id="totalCnt">0</span> <span id="unitTxt">symbols</span></div><div class="res-meta" id="resMeta">All</div></div>
   <div class="stat-chips" id="statChips"></div>
 </div>
 <div class="tag-bar empty" id="tagBar"></div>
 <div class="tbl-area" id="tblArea">
   <div class="empty"><div class="ei">...</div><div class="em">Loading...</div></div>
 </div>
 <div class="pag" id="pag"></div>
</div>
</div>

<div class="overlay" id="overlay">
<div class="modal">
 <div class="modal-hd">
   <div class="modal-hd-info"><h2 id="m-ttl">--</h2><p id="m-sub">--</p></div>
   <button class="m-close" onclick="closeModal()">X</button>
 </div>
 <div class="price-strip" id="m-hero"></div>
 <div class="ind-strip" id="m-ind"></div>
 <div class="chart-area">
   <div class="chart-toolbar" id="chartToolbar"></div>
   <div class="panels-wrap" id="panelsWrap">
     <div class="panel" id="panel1" style="flex:0 0 52%">
       <div class="panel-lbl" id="p1lbl">K-Line</div>
       <div class="panel-chart"><canvas id="c1"></canvas></div>
       <div class="vp-sidebar" id="vpSidebar"><canvas id="cVP" class="vp-canvas"></canvas></div>
     </div>
     <div class="rh" id="rh1"></div>
     <div class="panel" id="panel2" style="flex:0 0 20%">
       <div class="panel-lbl">Volume</div>
       <div class="panel-chart"><canvas id="c2"></canvas></div>
     </div>
     <div class="rh" id="rh2"></div>
     <div class="panel" id="panel3" style="flex:0 0 28%">
       <div class="panel-lbl" id="p3lbl">MACD</div>
       <div class="panel-chart"><canvas id="c3"></canvas></div>
     </div>
   </div>
 </div>
</div>
</div>

<div class="xhair-tip" id="xhTip"></div>

<script src="/static/js/markets.js"></script>
<script src="/static/js/websocket.js"></script>
<script src="/static/js/filters.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/app.js"></script>

</body>
</html>
